<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>رحلة الغذاء الصحي | نبراس التعليمية</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#092a45;color:#fff;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
#app{min-height:100vh;background:radial-gradient(circle at 50% 10%,#2b91c9 0,#125982 36%,#082a46 75%)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;position:relative;z-index:4}
.round{width:58px;height:58px;border-radius:50%;border:3px solid #ffd66b;background:linear-gradient(#7b39bb,#3d1476);color:#fff;font-size:26px;box-shadow:0 5px 0 #281044}
.brand{text-align:center;line-height:1}
.brand h1{margin:0;color:#fff0ae;text-shadow:0 4px 0 #713000,0 6px 10px #000;font-size:clamp(30px,5vw,68px)}
.brand .ribbon{display:inline-block;margin-top:9px;padding:9px 34px;border-radius:22px;background:linear-gradient(#7e35bd,#4b187f);border:2px solid #bd86ed;font-size:clamp(15px,2.1vw,27px);font-weight:900}
.map{position:relative;max-width:1450px;margin:0 auto;padding:16px 22px 35px}
.teacher{position:absolute;right:1.5%;top:0;width:19%;max-width:255px;min-width:135px;z-index:1;filter:drop-shadow(0 12px 10px #0018)}
.teacher .head{width:120px;height:120px;margin:auto;border-radius:50%;background:#ffd1a4;position:relative;border:8px solid #5b2e22}
.teacher .hair{position:absolute;inset:-13px -9px 40px;background:#4b251e;border-radius:60% 60% 35% 35%;z-index:-1}
.teacher .eyes{font-size:34px;text-align:center;padding-top:32px;color:#3a2019}.teacher .coat{height:150px;background:#f7f7f7;border-radius:45px 45px 20px 20px;border:4px solid #d9e4ea;position:relative}.teacher .coat:after{content:"🍎";position:absolute;left:42%;top:42px;font-size:45px}
.board{background:linear-gradient(180deg,#78431f,#4c2816);border:10px solid #a86b31;border-radius:34px;padding:25px 20px 22px;box-shadow:inset 0 0 35px #210d08,0 15px 30px #0018}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px;align-items:stretch;margin-right:14%}
.stage{position:relative;min-height:205px;border-radius:28px;padding:16px 12px 13px;text-align:center;background:linear-gradient(160deg,#7e35bd,#37105f);border:4px solid #c793ff;box-shadow:0 10px 0 #230d3b,0 15px 25px #0007;transition:.18s;overflow:hidden}
.stage:hover{transform:translateY(-5px) scale(1.02)}.stage .num{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:#f4b52d;border:4px solid #fff1a4;color:#4b2300;font-size:24px;font-weight:900;display:grid;place-items:center}
.stage .icon{font-size:70px;filter:drop-shadow(0 7px 5px #0005);margin-top:14px}.stage h3{font-size:20px;margin:5px 0 3px}.stage p{font-size:13px;margin:0;color:#f6eaff}
.stage.final{background:linear-gradient(160deg,#c58b16,#744100);border-color:#ffe188}.stage.final .icon{font-size:78px}
.status{max-width:1180px;margin:18px auto 0;display:flex;gap:15px;align-items:center}.stars{background:#311354;border:3px solid #9b64d4;border-radius:20px;padding:12px 18px;font-weight:900;white-space:nowrap}.bar{height:22px;flex:1;border-radius:20px;background:#27113d;border:3px solid #8752bd;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffd02e,#ff8b22);transition:.4s}
.screen{display:none;min-height:calc(100vh - 85px);padding:25px}.screen.active{display:block}.gamecard{max-width:980px;margin:25px auto;background:linear-gradient(#fff,#e9f5ff);color:#163047;border-radius:30px;border:7px solid #7241a4;box-shadow:0 16px 40px #0007;padding:24px;text-align:center;position:relative}
.gamecard h2{font-size:clamp(25px,4vw,42px);color:#5a208c;margin:4px 0 15px}.q{font-size:clamp(20px,3vw,31px);font-weight:900;margin:12px auto 22px;max-width:800px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.choice{border:3px solid #8b66a8;background:#fff;border-radius:18px;padding:16px;font-size:19px;font-weight:800;color:#273747;box-shadow:0 5px 0 #d5c5e3}.choice.good{background:#dff7df;border-color:#28a745}.choice.bad{background:#ffe1e1;border-color:#d83d3d}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.btn{border:0;border-radius:18px;padding:12px 24px;font-size:18px;font-weight:900;color:white;background:linear-gradient(#59bf38,#268b21);box-shadow:0 5px 0 #176118}.btn.alt{background:linear-gradient(#8b45c1,#532081);box-shadow:0 5px 0 #32134e}
.match{display:grid;grid-template-columns:1fr 1fr;gap:18px}.col{display:flex;flex-direction:column;gap:12px}.matchbtn{padding:15px;border-radius:15px;border:3px solid #7a4aa1;background:white;color:#26384a;font-weight:800;font-size:17px}.selected{outline:5px solid #ffbd24}.done{opacity:.55;background:#d9f5dd}
.gift{font-size:120px;animation:bob 1.3s infinite}.gift.open{animation:pop .5s forwards}@keyframes bob{50%{transform:translateY(-12px)}}@keyframes pop{50%{transform:scale(1.25) rotate(8deg)}}
.pyramid{max-width:520px;margin:auto}.tier{margin:5px auto;padding:12px;border-radius:12px;font-weight:900;color:#34200d;border:3px solid #fff8}.tier:nth-child(1){width:28%;background:#f3c63b}.tier:nth-child(2){width:48%;background:#ef8b3e}.tier:nth-child(3){width:70%;background:#67c85d}.tier:nth-child(4){width:92%;background:#e4a86d}
.plateWrap{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center}.foods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.food{background:#fff;border:3px solid #d1b3e7;border-radius:14px;padding:10px;font-size:17px;color:#26384a}.food.sel{background:#e5f7dc;border-color:#42a52e}.plate{aspect-ratio:1;border-radius:50%;background:#fafafa;border:18px solid #dfe8ed;box-shadow:inset 0 0 20px #aab5bd,0 10px 20px #0003;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px;padding:25px;font-size:45px}
#celebrate{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.conf{position:absolute;top:-30px;width:13px;height:25px;border-radius:3px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(900deg)}}
.win{font-size:100px;animation:trophy .8s ease-in-out infinite alternate}@keyframes trophy{to{transform:scale(1.12) rotate(4deg)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(120px);background:#15283b;color:#fff;padding:14px 24px;border-radius:20px;font-size:18px;font-weight:900;z-index:100;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.path{grid-template-columns:repeat(2,1fr);margin-right:0;padding-top:140px}.teacher{right:50%;transform:translateX(50%);top:-5px}.stage{min-height:175px}.stage .icon{font-size:55px}.choices{grid-template-columns:1fr}.plateWrap{grid-template-columns:1fr}.status{padding:0 12px}.match{grid-template-columns:1fr}}

.approved-home{
  position:relative; width:min(100%,1536px); aspect-ratio:1536/1024; margin:auto;
  background-size:contain;background-position:center;background-repeat:no-repeat;
  overflow:hidden;box-shadow:0 18px 42px #0007;
}
.live-controls{position:absolute;top:2.5%;right:2.3%;display:flex;gap:10px;z-index:20}
.live-controls .round{width:54px;height:54px}
.guide-talk{
 position:absolute;right:2.7%;top:19%;z-index:20;width:23%;
 background:rgba(255,249,223,.96);color:#3e2a1d;border:4px solid #e9b842;border-radius:18px;
 padding:10px;font-weight:900;font-size:clamp(11px,1.25vw,18px);box-shadow:0 7px 15px #0005
}
.hot{position:absolute;border:0;background:transparent;border-radius:24px;z-index:15}
.hot:hover{box-shadow:0 0 0 5px rgba(255,221,73,.55)}
/* Approved image station hit areas: 4 top + 4 bottom. We use only 7; the final hotspot maps to the trophy/final station. */
.h1{left:5.5%;top:34%;width:20%;height:22%}
.h2{left:26%;top:34%;width:20%;height:22%}
.h3{left:46.5%;top:34%;width:20%;height:22%}
.h4{left:67%;top:34%;width:20%;height:22%}
.h5{left:6%;top:57%;width:20%;height:23%}
.h6{left:27%;top:57%;width:20%;height:23%}
.h7{left:68%;top:57%;width:20%;height:23%}
@media(max-width:700px){
 .guide-talk{width:31%;right:1%;top:17%;font-size:9px;padding:5px;border-width:2px}
 .live-controls .round{width:38px;height:38px;font-size:18px}
}

@keyframes popStar{0%{transform:scale(0) rotate(0);opacity:0}45%{transform:scale(1.5) rotate(180deg);opacity:1}100%{transform:scale(.7) rotate(360deg);opacity:0}}

.reinforce-star{
  position:fixed; z-index:120; pointer-events:none; font-size:42px;
  animation:reinforcePop .9s ease-out forwards;
}
@keyframes reinforcePop{
  0%{transform:scale(.2) translateY(20px);opacity:0}
  40%{transform:scale(1.35) translateY(-10px);opacity:1}
  100%{transform:scale(.8) translateY(-55px);opacity:0}
}

</style>
</head>

<script>
let score=0,soundOn=true,stage=1,sub=0,matchA=null,matchDone=0,plate=[];
const AC=window.AudioContext||window.webkitAudioContext; let ctx;
function tone(freq=600,d=.12,type='sine'){if(!soundOn)return;try{ctx=ctx||new AC();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}

function reinforceBurst(){
  for(let i=0;i<8;i++){
    const s=document.createElement('div');
    s.className='reinforce-star';
    s.textContent=i%2?'⭐':'✨';
    s.style.left=(42+Math.random()*16)+'vw';
    s.style.top=(38+Math.random()*14)+'vh';
    s.style.animationDelay=(Math.random()*.18)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1200);
  }
}

function correct(){reinforceBurst();tone(660,.1);setTimeout(()=>tone(880,.18),100);score+=10;update();toast("أحسنتِ! ⭐ إجابة صحيحة")}
function wrong(){tone(180,.22,'sawtooth');toast("حاولي مرة أخرى 🌱")}
function reward(){tone(523,.12);setTimeout(()=>tone(659,.12),120);setTimeout(()=>tone(784,.25),240)}
function update(){document.getElementById('score').textContent=score;document.getElementById('fill').style.width=Math.min(100,score/1.4)+"%"}

function speakIntro(){
  tone(660,.08);
  const msg="مرحبًا يا أبطال! أمامكم سبعة تحديات في رحلة الغذاء الصحي. ابدؤوا بمفهوم الغذاء المتوازن، ثم اختاروا المصدر المناسب، وطابقوا أهمية المجموعات الغذائية، واكتشفوا سر الماء، وتعرّفوا على الهرم الغذائي، ثم ابنوا طبقًا صحيًا. اجمعوا النجوم حتى تصلوا إلى التحدي النهائي وكأس بطل الصحة!";
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(msg);
    u.lang='ar-SA';u.rate=.9;u.pitch=1.05;
    speechSynthesis.speak(u);
  } else toast("ابدؤوا التحدي واجمعوا النجوم ⭐");
}

function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';tone(520)}
function goHome(){document.getElementById('game').classList.remove('active');document.getElementById('home').style.display='block';sub=0}
function openStage(n){stage=n;sub=0;document.getElementById('home').style.display='none';document.getElementById('game').classList.add('active');render()}
function nav(){return `<div class="nav"><button class="btn alt" onclick="goHome()">الرئيسية</button></div>`}
function mc(title,q,opts,ans,next){let choices=opts.map((x,i)=>`<button class="choice" onclick="pick(this,${i},${ans},'${next||""}')">${x}</button>`).join('');return `<h2>${title}</h2><div class="q">${q}</div><div class="choices">${choices}</div>${nav()}`}
function pick(el,i,a,next){if(el.dataset.lock)return;if(i===a){el.classList.add('good');correct();el.parentElement.querySelectorAll('button').forEach(b=>b.dataset.lock=1);setTimeout(()=>{if(next==='sub'){sub++;render()}else if(next==='win')win();else goHome()},700)}else{el.classList.add('bad');wrong();setTimeout(()=>el.classList.remove('bad'),450)}}
function render(){let c=document.getElementById('card');
if(stage===1)c.innerHTML=mc("مفهوم الغذاء المتوازن","ما المقصود بالغذاء المتوازن؟",["تناول نوع واحد من الطعام","تناول أطعمة متنوعة بكميات مناسبة","تناول الحلويات فقط","الإكثار من الطعام"],1);
if(stage===2){if(sub===0)c.innerHTML=mc("المصدر المناسب","أيّ الأطعمة الآتية يُعد مصدرًا للكربوهيدرات؟",["🍞 الخبز","🥚 البيض","🐟 السمك","🍗 الدجاج"],0,'sub');else c.innerHTML=mc("المصدر المناسب","أيّ الأطعمة الآتية يُعد مصدرًا للبروتينات؟",["🍚 الأرز","🥚 البيض","🍞 الخبز","🍝 المعكرونة"],1);}
if(stage===3)renderMatch(c);
if(stage===4)c.innerHTML=`<h2>صندوق المفاجآت</h2><div class="gift" id="gift">🎁</div><div class="q">اضغطي على الصندوق واكتشفي أهمية الماء للجسم</div><button class="btn" onclick="openGift()">افتحي الصندوق</button>${nav()}`;
if(stage===5)c.innerHTML=mc("الهرم الغذائي","ماذا يوضح الهرم الغذائي؟",["الأطعمة التي نأكلها مرة واحدة فقط","الكميات المناسبة من مجموعات الغذاء المختلفة","أن جميع الأطعمة تؤكل بالكميات نفسها","أن الجسم لا يحتاج إلى تنوع الغذاء"],1);
if(stage===6)renderPlate(c);
if(stage===7)c.innerHTML=mc("التحدي النهائي","أي وجبة تمثل غذاءً متوازنًا بصورة أفضل؟",["🍬 حلوى + مشروب غازي","🍚 أرز + 🍗 دجاج + 🥦 خضار + 🥛 حليب","🍟 بطاطس مقلية فقط","🍞 خبز فقط"],1,'win');
}
function renderMatch(c){matchA=null;matchDone=0;c.innerHTML=`<h2>أهمية المجموعات الغذائية</h2><div class="q">صِلِي كل مجموعة غذائية بوظيفتها المناسبة</div><div class="match"><div class="col">
<button class="matchbtn" data-id="carb" onclick="selA(this)">الكربوهيدرات</button><button class="matchbtn" data-id="protein" onclick="selA(this)">البروتينات</button><button class="matchbtn" data-id="fat" onclick="selA(this)">الدهون</button>
</div><div class="col">
<button class="matchbtn" data-id="protein" onclick="selB(this)">النمو وتعويض الخلايا التالفة</button><button class="matchbtn" data-id="fat" onclick="selB(this)">تزويد الجسم بالطاقة والمساعدة في امتصاص بعض الفيتامينات</button><button class="matchbtn" data-id="carb" onclick="selB(this)">المصدر الرئيس للطاقة في الجسم</button>
</div></div>${nav()}`}
function selA(b){if(b.classList.contains('done'))return;document.querySelectorAll('.match .col:first-child .matchbtn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');matchA=b}
function selB(b){if(!matchA||b.classList.contains('done'))return;if(matchA.dataset.id===b.dataset.id){matchA.classList.remove('selected');matchA.classList.add('done');b.classList.add('done');matchA=null;matchDone++;correct();if(matchDone===3)setTimeout(goHome,800)}else{wrong();b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400)}}
function openGift(){let g=document.getElementById('gift');g.classList.add('open');g.textContent='💧';correct();setTimeout(()=>{document.querySelector('.gamecard .q').innerHTML="الماء يشكل جزءًا كبيرًا من وزن الجسم، ويساعد في الهضم والتخلص من الفضلات والمحافظة على درجة حرارة الجسم المناسبة."},350)}
function renderPlate(c){plate=[];c.innerHTML=`<h2>ابنِ طبقك الصحي</h2><div class="q">اختاري مكونات وجبة متوازنة وضعيها في الطبق</div><div class="plateWrap"><div class="foods">
<button class="food" data-v="🍚" data-g="carb" onclick="food(this)">🍚 أرز</button><button class="food" data-v="🍗" data-g="protein" onclick="food(this)">🍗 دجاج</button><button class="food" data-v="🥦" data-g="veg" onclick="food(this)">🥦 خضار</button><button class="food" data-v="🥛" data-g="milk" onclick="food(this)">🥛 حليب</button><button class="food" data-v="🍬" data-g="sweet" onclick="food(this)">🍬 حلوى</button><button class="food" data-v="🥤" data-g="soda" onclick="food(this)">🥤 مشروب غازي</button>
</div><div class="plate" id="plate">🍽️</div></div><div class="nav"><button class="btn alt" onclick="goHome()">الرئيسية</button><button class="btn" onclick="checkPlate()">تحقق من الطبق</button></div>`}
function food(b){let g=b.dataset.g;if(plate.includes(g)){plate=plate.filter(x=>x!==g);b.classList.remove('sel')}else{plate.push(g);b.classList.add('sel')}document.getElementById('plate').innerHTML=[...document.querySelectorAll('.food.sel')].map(x=>x.dataset.v).join(' ')||'🍽️'}
function checkPlate(){let ok=['carb','protein','veg'].every(x=>plate.includes(x))&&!plate.includes('soda');if(ok){correct();setTimeout(goHome,800)}else wrong()}
function win(){score+=30;update();reward();confetti();starBurst();document.getElementById('card').innerHTML=`<div class="win">🏆</div><h2>أحسنتِ يا بطلة الصحة!</h2><div class="q">أنهيتِ رحلة الغذاء الصحي بنجاح وجمعتِ نجوم المعرفة ⭐</div><button class="btn" onclick="goHome()">العودة للخريطة</button>`}

function starBurst(){
  const box=document.getElementById('celebrate');
  for(let i=0;i<28;i++){
    const s=document.createElement('div');
    s.textContent=i%2?'⭐':'✨';
    s.style.cssText=`position:absolute;left:${10+Math.random()*80}vw;top:${10+Math.random()*70}vh;font-size:${22+Math.random()*34}px;animation:popStar 1.2s ease-out forwards;`;
    box.appendChild(s);
  }
}

function confetti(){let box=document.getElementById('celebrate');box.innerHTML='';let cs=['#ffd52b','#ff4d6d','#50d890','#8d5cf6','#46b5ff'];for(let i=0;i<100;i++){let d=document.createElement('i');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%cs.length];d.style.animationDelay=Math.random()*.7+'s';d.style.animationDuration=(2+Math.random()*2)+'s';box.appendChild(d)}setTimeout(()=>box.innerHTML='',4500)}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1300)}
update();
</script></body></html>
